[package]
name = "zalo-client"
version = "0.1.0"
edition = "2021"
description = "Rust client for Zalo web API (reverse-engineered protocol)"
license = "MIT"
repository = "https://github.com/DEVTRAN07/Zalo-Client"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md-5 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
url = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
rand = "0.8"
hex = "0.4"
urlencoding = "2"
aes-gcm = "0.10"
flate2 = "1"
chrono = "0.4"
unicode-normalization = "0.1"
generic-array = "0.14"
futures-util = "0.3"
reqwest_cookie_store = "0.8"
cookie_store = "0.21"

[dev-dependencies]
env_logger = "0.11"
